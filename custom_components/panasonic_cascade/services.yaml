populate_dashboard:
  name: Populate Cascade dashboard
  description: Populate an existing empty dashboard with current values and controls from the Cascade integration.
  fields:
    url_path:
      name: Dashboard URL path
      description: The URL path of the empty dashboard, for example panasonic-cascade.
      required: true
      example: panasonic-cascade
      selector:
        text:
    entry_id:
      name: Installation
      description: Optionally select one integration entry. Leave empty to include all Cascade installations.
      selector:
        config_entry:
          integration: panasonic_cascade
    overwrite:
      name: Replace existing dashboard configuration
      description: Enable only if the existing cards in this dashboard should be replaced.
      default: false
      selector:
        boolean:
