name: Validate heating curve frontend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Curve logic and Chromium interaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/frontend/math.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/frontend/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heating-curve-screenshots
          path: heating-curve-*.png
          if-no-files-found: ignore
