name: Validate Safari heating curve

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    name: WebKit interaction and responsive layout
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps webkit
      - run: node tests/frontend/browser.cjs
        env:
          BROWSER_ENGINE: webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heating-curve-webkit-screenshots
          path: heating-curve-*.png
          if-no-files-found: ignore
